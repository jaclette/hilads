# Same as type_and_check.yaml for a password field (its text is masked): the
# second tap must still land on the field, then it is cleared.
appId: com.hilads.app
---
# CLOSE: "1" when the keyboard is still up from the previous field: a tap on
# the screen's header closes it (the keyboard rule's "tap outside"). Never
# Maestro's hideKeyboard: on Android it presses back (leaves the screen), on
# iOS it cannot dismiss React Native's keyboard.
- runFlow:
    when:
      true: ${typeof CLOSE !== 'undefined' && CLOSE == '1'}
    commands:
      - tapOn:
          id: "header-title"
- scrollUntilVisible:
    element:
      id: ${FIELD}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: ${FIELD}
- inputText: ${TEXT}
- tapOn:
    id: ${FIELD}
- assertVisible:
    id: ${FIELD}
- eraseText: 40
