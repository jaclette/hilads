appId: com.hilads.app
tags: [keyboard]
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/open_link.yaml
    env: { LINK: "hilads://sign-in" }
- runFlow:
    file: ../subflows/type_and_check.yaml
    env: { FIELD: "signin-email", TEXT: "keyboard.test@example.com" }
- runFlow:
    file: ../subflows/type_secret.yaml
    env: { CLOSE: "1", FIELD: "signin-password", TEXT: "not-a-password" }
