# Passport → Settings → back (Passport) → back (Today).
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- tapOn:
    id: "tab-passport"
- extendedWaitUntil:
    visible:
      id: "passport-settings"
    timeout: 30000
- tapOn:
    id: "passport-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "passport-settings"
    timeout: 30000
- assertNotVisible:
    id: "settings-screen"
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "tap", TAP: "tab-today" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
