# The guest sign-up sheet → back closes it (the screen behind stays).
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/open_link.yaml
    env: { LINK: "hilads://auth-gate?reason=daily_vote" }
- extendedWaitUntil:
    visible:
      id: "auth-gate"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "sheet" }
- extendedWaitUntil:
    notVisible:
      id: "auth-gate"
    timeout: 20000
- assertVisible:
    id: "today-screen"
# Swipe down closes it the same way.
- runFlow:
    file: ../subflows/open_link.yaml
    env: { LINK: "hilads://auth-gate?reason=daily_vote" }
- extendedWaitUntil:
    visible:
      id: "auth-gate"
    timeout: 30000
- swipe:
    start: 50%, 60%
    end: 50%, 95%
- extendedWaitUntil:
    notVisible:
      id: "auth-gate"
    timeout: 20000
