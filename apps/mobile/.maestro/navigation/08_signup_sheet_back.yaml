# The guest sign-up sheet → back closes it (the screen behind stays).
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- openLink: "hilads://auth-gate?reason=daily_vote"
- extendedWaitUntil:
    visible:
      id: "auth-gate"
    timeout: 30000
- back
- extendedWaitUntil:
    notVisible:
      id: "auth-gate"
    timeout: 20000
- assertVisible:
    id: "today-screen"
# Swipe down closes it the same way.
- openLink: "hilads://auth-gate?reason=daily_vote"
- extendedWaitUntil:
    visible:
      id: "auth-gate"
    timeout: 30000
- swipe:
    start: 50%, 60%
    end: 50%, 95%
- extendedWaitUntil:
    notVisible:
      id: "auth-gate"
    timeout: 20000
