# Today → yesterday's world tour → back → Today.
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- scrollUntilVisible:
    element:
      id: "tour-circle"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "tour-circle"
    index: 0
- extendedWaitUntil:
    visible:
      id: "daily-tour"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "modal" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
- assertNotVisible:
    id: "daily-tour"
