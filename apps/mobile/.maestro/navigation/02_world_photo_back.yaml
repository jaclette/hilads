# Bug: Today → a photo in "Today around the world" → Android back closed the
# viewer but the sheet's own back arrow stopped working.
# Expected: back closes the viewer, then everything keeps working.
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- scrollUntilVisible:
    element:
      id: "strip-world-.*"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "strip-world-.*"
- extendedWaitUntil:
    visible:
      id: "proof-viewer"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "modal" }
- extendedWaitUntil:
    notVisible:
      id: "proof-viewer"
    timeout: 20000
- assertVisible:
    id: "daily-sheet"
# The sheet's own back arrow still works.
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
- assertNotVisible:
    id: "daily-sheet"
# And the app still navigates: open the challenge again and come back.
- scrollUntilVisible:
    element:
      id: "today-hero"
    direction: UP
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "today-hero"
- extendedWaitUntil:
    visible:
      id: "daily-sheet"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "today-hero"
    timeout: 30000
