# Bug: Today → a photo of today's mosaic ("Same challenge. Different
# worlds.") → back closed the viewer but the app stopped navigating.
# Expected: back closes the stories viewer (a mosaic card opens it), then everything keeps working.
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- scrollUntilVisible:
    element:
      id: "mosaic-tile"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "mosaic-tile"
- extendedWaitUntil:
    visible:
      id: "today-stories"
    timeout: 30000
# The stories viewer closes with a swipe down (iOS) or back (Android).
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "modal" }
- extendedWaitUntil:
    notVisible:
      id: "today-stories"
    timeout: 20000
- assertVisible:
    id: "today-screen"
# And the app still navigates: open the challenge again and come back.
- scrollUntilVisible:
    element:
      id: "today-hero"
    direction: UP
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "today-hero"
- extendedWaitUntil:
    visible:
      id: "daily-sheet"
    timeout: 30000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "today-hero"
    timeout: 30000
