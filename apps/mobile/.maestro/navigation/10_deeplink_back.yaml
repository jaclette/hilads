# A link to today's challenge opens the sheet with Today under it: back → Today, never out of the app.
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- stopApp
- runFlow:
    file: ../subflows/open_link.yaml
    env: { LINK: "hilads://today" }
- runFlow:
    when:
      true: ${typeof DEV_URL !== 'undefined' && DEV_URL != ''}
    commands:
      # A dev build reloads its bundle first: open the link once the app is up.
      - extendedWaitUntil:
          visible:
            id: "today-screen"
          timeout: 90000
      - runFlow:
          file: ../subflows/open_link.yaml
          env: { LINK: "hilads://today" }
- extendedWaitUntil:
    visible:
      id: "daily-sheet"
    timeout: 90000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
- assertNotVisible:
    id: "daily-sheet"
