# Today → challenge screen → a "The world says" bubble → that country in
# "See all" → back (the challenge screen) → back (Today).
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- tapOn:
    id: "today-hero"
- extendedWaitUntil:
    visible:
      id: "daily-sheet"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "world-bubble"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "world-bubble"
    index: 0
- extendedWaitUntil:
    visible:
      id: "countries-screen"
    timeout: 20000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    notVisible:
      id: "countries-screen"
    timeout: 20000
- assertVisible:
    id: "daily-sheet"
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
- assertNotVisible:
    id: "daily-sheet"
