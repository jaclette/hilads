# Today → challenge sheet → Compare → a city → back (the board) → back (Today).
appId: com.hilads.app
tags: [navigation]
---
- runFlow: ../subflows/start.yaml
- tapOn:
    id: "today-hero"
- extendedWaitUntil:
    visible:
      id: "daily-sheet"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "chip-compare"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "chip-compare"
- scrollUntilVisible:
    element:
      id: "compare-city"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 60
    centerElement: true
    speed: 45
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "compare-city"
- extendedWaitUntil:
    visible:
      id: "compare-all-cities"
    timeout: 20000
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "tap", TAP: "compare-all-cities" }
- extendedWaitUntil:
    notVisible:
      id: "compare-all-cities"
    timeout: 20000
- assertVisible:
    id: "daily-sheet"
- runFlow:
    file: ../subflows/back.yaml
    env: { KIND: "screen" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
- assertNotVisible:
    id: "daily-sheet"
